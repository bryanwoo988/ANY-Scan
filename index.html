<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AnyScan</title>
    <meta name="description" content="AnyScan — free document scanner, PDF tools and QR codes. Works offline, keeps files on your phone." />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnyScan" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Apply the theme before first paint to avoid a flash (same approach as the Bible app).
      try {
        var s = JSON.parse(localStorage.getItem('anyscan.settings') || '{}')
        var legacy = { black: 'dark', ocean: 'dark', forest: 'dark', sakura: 'light', sunset: 'light' }
        var mode = legacy[s.theme] || s.theme
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var looks = dark ? ['midnight', 'oled', 'slate', 'grape'] : ['classic', 'paper', 'mint', 'lavender']
        var look = dark ? s.darkLook : s.lightLook
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.palette = looks.indexOf(look) >= 0 ? look : looks[0]
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
