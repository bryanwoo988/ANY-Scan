<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AnyScan</title>
    <meta name="description" content="AnyScan — free document scanner, PDF tools and QR codes. Works offline, keeps files on your phone." />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AnyScan" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Apply the theme before first paint to avoid a flash (same approach as the Bible app).
      try {
        var s = JSON.parse(localStorage.getItem('anyscan.settings') || '{}')
        var legacy = { black: 'dark', ocean: 'dark', forest: 'dark', sakura: 'light', sunset: 'light' }
        var mode = legacy[s.theme] || s.theme
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var looks = dark ? ['midnight', 'oled', 'slate', 'grape'] : ['classic', 'paper', 'mint', 'lavender']
        var look = dark ? s.darkLook : s.lightLook
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.palette = looks.indexOf(look) >= 0 ? look : looks[0]
      } catch (e) {}
    </script>
    <style id="splash-css">
      /* Splash: shown from the first paint until the app is ready. scripts/make-splash.mjs renders the
         same markup into the iOS launch images, so the hand-off is seamless. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding-bottom: 8vh;
        background: linear-gradient(160deg, #13b98c 0%, #1a8fc0 55%, #2f5fe0 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Noto Sans', 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      .splash-logo {
        position: relative;
        width: 124px;
        height: 124px;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(6, 30, 60, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.35);
      }
      .splash-logo img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .splash-name {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .splash-tag,
      .splash-foot {
        font-size: 16px;
        opacity: 0;
        color: rgba(255, 255, 255, 0.9);
      }
      .splash-tag {
        margin-top: -12px;
      }
      .splash-foot {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      /* Animations run only in the live app, not in the static launch images. */
      #splash.animate .splash-logo {
        animation: splash-pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      #splash.animate .splash-logo::after {
        content: '';
        position: absolute;
        left: 8%;
        right: 8%;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        animation: splash-beam 1.2s ease-in-out 0.25s infinite;
      }
      #splash.animate .splash-tag,
      #splash.animate .splash-foot {
        animation: splash-fade 0.5s ease 0.3s both;
      }
      @keyframes splash-pop {
        from {
          transform: scale(0.82);
        }
      }
      @keyframes splash-beam {
        0%,
        100% {
          top: 14%;
        }
        50% {
          top: 82%;
        }
      }
      @keyframes splash-fade {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash.animate .splash-logo,
        #splash.animate .splash-logo::after {
          animation: none;
        }
      }
    </style>
<!--SPLASH-LINKS-->

    <link rel="apple-touch-startup-image" href="./splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="./splash/splash-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <!--/SPLASH-LINKS-->
  </head>
  <body>
    <div id="splash" class="animate" aria-hidden="true">
      <div class="splash-logo"><img src="./icons/logo.svg" alt="" /></div>
      <div class="splash-name">AnyScan</div>
      <div class="splash-tag" id="splash-tag">Scan anything. Free forever.</div>
      <div class="splash-foot" id="splash-foot">No ads · No sign-up · Works offline</div>
    </div>
    <script>
      // Tagline in the language chosen in AnyScan (English until one is chosen), before the app's own translations load.
      try {
        var sl = JSON.parse(localStorage.getItem('anyscan.settings') || '{}').lang
        var tx = sl === 'zh' ? ['扫描一切，永久免费', '无广告 · 免注册 · 可离线使用'] : sl === 'ms' ? ['Imbas apa sahaja. Percuma selamanya.', 'Tiada iklan · Tiada daftar · Luar talian'] : null
        if (tx) {
          document.getElementById('splash-tag').textContent = tx[0]
          document.getElementById('splash-foot').textContent = tx[1]
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
